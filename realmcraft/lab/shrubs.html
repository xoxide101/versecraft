<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrub Lab</title>
<style>
  :root { --ink: #e8f0ff; --panel: rgba(14, 24, 52, .86); --edge: rgba(120, 160, 255, .45); --gold: #facc15; --dim: #9fb3d9; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1230; color: var(--ink); font: 13px system-ui, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; } #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1.5px solid var(--edge); }
  .bar b { color: var(--gold); margin-right: 6px; } .bar button { background: #16264f; color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .bar button.on { background: #2b4a9a; border-color: var(--gold); } .bar label { display: flex; gap: 5px; align-items: center; color: var(--dim); margin-left: 6px; }
  .help { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 4px 12px; border-radius: 6px; background: rgba(14,24,52,.7); color: var(--dim); font-size: 12px; }
  .tag { position: fixed; padding: 2px 8px; border-radius: 5px; background: rgba(14,24,52,.8); border: 1px solid var(--edge); font: 700 11px ui-monospace, Consolas, monospace; text-transform: uppercase; pointer-events: none; transform: translate(-50%, -100%); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar" id="bar"><b>SHRUB LAB</b></div>
<div class="help">drag to turn · right-drag or Shift-drag to move · wheel to zoom (right up close) · click a name to go to it</div>
<script src="../lib/realm-libs.js"></script>
<script src="../js/rc-core.js"></script>
<script src="../js/rc-textures.js"></script>
<script src="../js/rc-flora.js"></script>
<script src="../js/rc-covers.js"></script>
<script>
(function () {
  const T = THREE;
  RC.quality = { tier: 'high', grass: 1 };
  const host = document.getElementById('stage'), r = new T.WebGLRenderer({ antialias: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap; r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace; host.append(r.domElement);
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(35, 1, 0.05, 400);
  const sky = new T.Sky(); sky.scale.setScalar(300); scene.add(sky); const su = sky.material.uniforms; su.turbidity.value = 5; su.rayleigh.value = 1.6; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.82;
  scene.fog = new T.Fog('#bcd8f0', 40, 160);
  const hemi = new T.HemisphereLight('#dbeafe', '#4d7c3a', 0.85), sun = new T.DirectionalLight('#fff1dc', 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 }); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; scene.add(hemi, sun, sun.target);
  const shared = { uTime: { value: 0 }, uWind: { value: new T.Vector3(0.2, 0.1, 0.4) } };
  // ground: soft mottled grass with relief, and grass clumps around
  const gc = RC.Tex.cv(512, 512), gh = RC.Tex.cv(512, 512), g = gc.getContext('2d'), hg = gh.getContext('2d'); hg.fillStyle = '#808080'; hg.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y += 2) for (let x = 0; x < 512; x += 2) { const p = RC.fbm(x, y, 96, 4, 3), d = RC.smooth01((RC.fbm(x + 300, y, 70, 5, 5) - 0.62) / 0.06); g.fillStyle = `hsl(${RC.lerp(96 + p * 14, 32, d)}, ${RC.lerp(40 + p * 14, 28, d)}%, ${RC.lerp(32 + p * 14, 28, d)}%)`; g.fillRect(x, y, 2, 2); }
  for (let i = 0; i < 9000; i++) { const x = Math.random() * 512, y = Math.random() * 512, l = Math.random() < 0.5; g.fillStyle = l ? 'rgba(190,230,140,.25)' : 'rgba(30,70,20,.3)'; g.fillRect(x, y, 1, 3); hg.fillStyle = l ? '#9a9a9a' : '#606060'; hg.fillRect(x, y, 1, 3); }
  g.filter = 'blur(1px)'; g.drawImage(gc, 0, 0); g.filter = 'none';
  const gt = RC.Tex.tex(T, gc); gt.repeat.set(8, 8); const gn = RC.Tex.normalFrom(T, gh, 3); gn.repeat.set(8, 8);
  const ground = new T.Mesh(new T.CircleGeometry(60, 64).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ map: gt, normalMap: gn, roughness: 0.95 })); ground.receiveShadow = true; scene.add(ground);
  const mats = RC.Flora.materials(T, shared);
  // the shrubs in a row, each with its name
  const KINDS = ['bush', 'berry', 'blossom', 'frost_bush', 'box', 'sapling', 'fern', 'ember_fern'], spots = [], tags = [];
  KINDS.forEach((k, i) => {
    const b = RC.Flora.bush(T, k, 7 + i, 1), grp = new T.Group(), x = (i - (KINDS.length - 1) / 2) * 2.2;
    const lm = mats.leafMat(b.leaf, k.includes('fern') ? 0.12 : 0.06).clone(); lm.color.set(b.color); lm.onBeforeCompile = mats.leafMat(b.leaf, k.includes('fern') ? 0.12 : 0.06).onBeforeCompile; lm.customProgramCacheKey = () => 'lab' + k;
    const lmesh = new T.Mesh(b.leaves, lm); lmesh.castShadow = lmesh.receiveShadow = true; lmesh.customDepthMaterial = new T.MeshDepthMaterial({ map: lm.map, alphaTest: 0.42, depthPacking: T.RGBADepthPacking }); grp.add(lmesh);
    if (b.fill) { const fm = mats.fillMat(b.leaf).clone(); fm.color.set(b.color); fm.onBeforeCompile = mats.fillMat(b.leaf).onBeforeCompile; fm.customProgramCacheKey = () => 'labf' + k; const f = new T.Mesh(b.fill, fm); f.castShadow = f.receiveShadow = true; grp.add(f); }
    if (b.bark) { const s = new T.Mesh(b.bark, mats.barkMat('birch')); s.castShadow = true; grp.add(s); }
    grp.position.set(x, 0, 0); scene.add(grp); spots.push({ k, x, grp });
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = k.replace('_', ' '); document.body.append(tag); tags.push(tag);
  });
  // grass: the town's covers; meadow all round with bare patches, taller and packed at the foot of each shrub
  const shared2 = shared; shared2.uRain = { value: 0 };
  const nearShrub = (x, z) => Math.min(...spots.map((s) => Math.hypot(x - s.x, z) - 0.55));
  const coverPatch = (k, mask, density) => { const R = RC.Covers.RECIPES[k], m = new T.Mesh(RC.Covers.build(T, R, 26, 14, k.length, mask, { density }), RC.Covers.material(T, shared2, R.rigid)); m.receiveShadow = true; m.castShadow = true; scene.add(m); };
  coverPatch('meadow', (x, z) => { const d = nearShrub(x, z); return d < 0.05 ? 0 : 0.75 * RC.smooth01((RC.Covers.vnoise(x + 30, z + 30, 2.4, 5) - 0.2) / 0.3); }, 0.45);
  coverPatch('summer_tall', (x, z) => { const d = nearShrub(x, z); return d < 0.05 ? 0 : 1 - RC.smooth01((d - 0.1) / 0.9); }, 0.5);
  coverPatch('tiny_spinifex', (x, z) => { const d = nearShrub(x, z); return d < 0 ? 0 : 1 - RC.smooth01(d / 0.5); }, 0.6);
  coverPatch('wildflower_meadow', (x, z) => RC.smooth01((RC.Covers.vnoise(x, z, 3, 21) - 0.65) / 0.12) * (nearShrub(x, z) > 0.4 ? 1 : 0), 0.4);
  // after-effects as in the town
  const comp = new T.EffectComposer(r); comp.addPass(new T.RenderPass(scene, cam)); const ao = RC.aoSkipCutouts(new T.GTAOPass(scene, cam, 800, 600)); ao.blendIntensity = 0.85; ao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.2, thickness: 1, scale: 1, samples: 16 }); comp.addPass(ao); comp.addPass(new T.OutputPass());
  // controls: an orbit around a target
  const view = { yaw: 0.5, pitch: 0.35, dist: 7, target: new T.Vector3(0, 0.4, 0) };
  let drag = null; const cv = r.domElement;
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) { const k = view.dist * 0.0016; view.target.x -= (Math.cos(view.yaw) * dx) * k; view.target.z += (Math.sin(view.yaw) * dx) * k; view.target.y = Math.max(0.05, view.target.y + dy * k); }
    else { view.yaw -= dx * 0.008; view.pitch = RC.clamp(view.pitch + dy * 0.006, -0.05, 1.45); } });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', (e) => { view.dist = RC.clamp(view.dist * (1 + Math.sign(e.deltaY) * 0.12), 0.35, 60); e.preventDefault(); }, { passive: false });
  // bar: go to each shrub, wind, time of day
  const bar = document.getElementById('bar'), btns = [];
  const goTo = (s) => { view.target.set(s.x, 0.45, 0); view.dist = 2.6; btns.forEach((b) => b.classList.toggle('on', b._s === s)); };
  for (const s of spots) { const b = document.createElement('button'); b.textContent = s.k.replace('_', ' '); b._s = s; b.onclick = () => goTo(s); bar.append(b); btns.push(b); }
  const all = document.createElement('button'); all.textContent = 'all'; all.onclick = () => { view.target.set(0, 0.4, 0); view.dist = 12; btns.forEach((b) => b.classList.remove('on')); }; bar.append(all);
  const slider = (label, min, max, val, fn) => { const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'range'; i.min = min; i.max = max; i.step = 'any'; i.value = val; i.oninput = () => fn(+i.value); l.append(label, i); bar.append(l); fn(val); };
  let windK = 0.4, hour = 14;
  slider('wind', 0, 1.6, 0.4, (v) => { windK = v; }); slider('hour', 5, 20, 14, (v) => { hour = v; });
  const resize = () => { const w = innerWidth, h = innerHeight; r.setSize(w, h); comp.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }; resize(); addEventListener('resize', resize);
  const clock = new T.Clock();
  (function frame() {
    const t = clock.getElapsedTime(); shared.uTime.value = t; shared.uWind.value.set(Math.sin(t * 0.2) * 0.3 * windK, 0.1 * windK, windK);
    const a = ((hour - 6) / 12) * Math.PI, sy = Math.sin(a); su.sunPosition.value.set(Math.cos(a) * 100, sy * 100, 40); sun.position.set(Math.cos(a) * 30, Math.max(2, sy * 30), 14); sun.intensity = 0.4 + Math.max(0, sy) * 2; sun.color.set(sy < 0.35 ? '#ffc48a' : '#fff1dc');
    const h = view.dist * Math.cos(view.pitch); cam.position.set(view.target.x + Math.sin(view.yaw) * h, view.target.y + view.dist * Math.sin(view.pitch), view.target.z + Math.cos(view.yaw) * h); cam.lookAt(view.target);
    spots.forEach((s, i) => { const v = new T.Vector3(s.x, 1.25, 0).project(cam); tags[i].style.display = v.z < 1 && view.dist < 30 ? '' : 'none'; tags[i].style.left = (v.x + 1) / 2 * innerWidth + 'px'; tags[i].style.top = (1 - v.y) / 2 * innerHeight + 'px'; });
    comp.render(); requestAnimationFrame(frame);
  })();
  window.LAB = { view, goTo, spots };
})();
</script>
</body>
</html>
