<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folk Lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1230; color: #e8f0ff; font: 13px system-ui, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; } #stage canvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; padding: 8px 10px; border-radius: 10px; background: rgba(14,24,52,.86); border: 1px solid rgba(120,160,255,.45); }
  .bar b { color: #facc15; } .bar button { background: #16264f; color: #e8f0ff; border: 1px solid rgba(120,160,255,.45); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar"><b>FOLK LAB</b><button id="walk">Walk</button><button id="idle">Idle</button><button id="near">Close</button><button id="far">Far</button></div>
<script src="../lib/realm-libs.js"></script>
<script src="../js/rc-core.js"></script>
<script src="../assets/folk/man.js"></script><script src="../assets/folk/hero.js"></script><script src="../assets/folk/man_stout.js"></script><script src="../assets/folk/woman.js"></script><script src="../assets/folk/woman_long.js"></script>
<script src="../assets/folk/elder_m.js"></script><script src="../assets/folk/elder_f.js"></script><script src="../assets/folk/boy.js"></script><script src="../assets/folk/girl.js"></script>
<script src="../js/rc-aging.js"></script>
<script src="../js/rc-folkhead.js"></script>
<script src="../js/rc-folk.js"></script>
<script>
(function () {
  const T = THREE, host = document.getElementById('stage'), r = new T.WebGLRenderer({ antialias: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.shadowMap.enabled = true; r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace; host.appendChild(r.domElement);
  const scene = new T.Scene(); scene.background = new T.Color('#9ab8d0'); const cam = new T.PerspectiveCamera(30, 1, 0.05, 200);
  scene.add(new T.HemisphereLight('#e8f0ff', '#5a6a40', 1.1)); const sun = new T.DirectionalLight('#fff1dc', 2.4); sun.position.set(4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun);
  const ground = new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ color: '#7a8a60', roughness: 1 })); ground.receiveShadow = true; scene.add(ground);
  const names = Object.keys(window.RC_FOLK), folks = [];
  const looks = [{ tunic: '#93c5fd' }, { tunic: '#b45309' }, { tunic: '#f472b6' }, { tunic: '#34d399' }, { tunic: '#9ca3af' }, { tunic: '#a78bfa' }, { tunic: '#fbbf24' }, { tunic: '#f87171' }];
  names.forEach((n, i) => { const f = RC.Folk.make({ id: 'p' + i, age: /elder/.test(n) ? 'elder' : /boy|girl/.test(n) ? 'child' : 'adult', sex: /woman|_f|girl/.test(n) ? 'f' : 'm', job: /stout/.test(n) ? 'hammer' : /^woman$/.test(n) ? 'baker' : 'stroll' }, looks[i], false); f.root.position.set((i - (names.length - 1) / 2) * 0.9, 0, 0); scene.add(f.root); folks.push(f); });
  let walk = 0, near = false; const set = () => { if (near === 2) return; cam.position.set(near ? 0.4 : 0, near ? 1.5 : 1.6, near ? 2.2 : 9); cam.lookAt(near ? 0.4 : 0, near ? 1.35 : 0.9, 0); };
  document.getElementById('walk').onclick = () => (walk = 1); document.getElementById('idle').onclick = () => (walk = 0);
  document.getElementById('near').onclick = () => { near = true; set(); }; document.getElementById('far').onclick = () => { near = false; set(); }; set();
  window.FOLK = { folks, set: (w, n) => { walk = w; near = n; set(); }, face: (i) => { const p = folks[i].root.position; near = 2; cam.position.set(p.x + 0.12, 1.62 * (/boy|girl/.test(folks[i].name) ? 0.7 : 1), 0.75); cam.lookAt(p.x, 1.55 * (/boy|girl/.test(folks[i].name) ? 0.7 : 1), 0); } };
  const resize = () => { r.setSize(host.clientWidth, host.clientHeight); cam.aspect = host.clientWidth / host.clientHeight; cam.updateProjectionMatrix(); }; addEventListener('resize', resize); resize();
  const clock = new T.Clock();
  r.setAnimationLoop(() => { const dt = Math.min(0.05, clock.getDelta()); for (const f of folks) if (f.ready) { f.actions.move.setEffectiveWeight(walk); f.actions.idle.setEffectiveWeight(1 - walk); f.mixer.update(dt); if (f.head) f.head.update(clock.elapsedTime); } r.render(scene, cam); });
})();
</script>
</body>
</html>
